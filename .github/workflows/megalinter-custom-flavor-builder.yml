---
# =============================================================
# Build MegaLinter Custom Flavor Workflow
#
# This workflow builds and publishes a custom MegaLinter Docker image
# to GitHub Container Registry (ghcr.io).
#
# Flow (no Personal Access Token required):
#   1. Renovate bumps MEGALINTER_VERSION below (commit type "feat") when a new
#      MegaLinter release is published, and merges it to main.
#   2. release-please opens/updates a release PR for that change.
#   3. Merging the release PR publishes a GitHub Release, which triggers this
#      workflow.
#   4. The image is built from the pinned MegaLinter version and pushed to
#      ghcr.io as :<megalinter-version> and :latest.
#
# The MegaLinter custom flavor image will be available at:
#   - ghcr.io/<owner>/<repo>/megalinter-custom-flavor:<tag>
# =============================================================
name: Build & Push MegaLinter Custom Flavor

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # MegaLinter version the custom flavor is built from.
  # Renovate keeps this in sync with new MegaLinter releases.
  # renovate: datasource=github-releases depName=oxsecurity/megalinter
  MEGALINTER_VERSION: "v9.6.0"

jobs:
  build-custom-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Repository Name
        id: lowercase-repo
        run: echo "repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Build MegaLinter Custom Flavor
        uses: oxsecurity/megalinter/flavors/custom-builder@main
        with:
          megalinter-custom-flavor-builder-tag: ${{ env.MEGALINTER_VERSION }}
          platform: "linux/amd64"
          is-latest: "true"
          upload-to-ghcr: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_FLAVOR_BUILD_REPO: ${{ steps.lowercase-repo.outputs.repo }}
          CUSTOM_FLAVOR_BUILD_REPO_URL: ${{ github.repositoryUrl }}
          CUSTOM_FLAVOR_BUILD_USER: ${{ github.actor }}
