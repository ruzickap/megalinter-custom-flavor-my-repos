---
# =============================================================
# Build MegaLinter Custom Flavor Workflow
#
# This workflow builds and publishes a custom MegaLinter Docker image
# to GitHub Container Registry (ghcr.io).
#
# Flow (no Personal Access Token required):
#   1. Renovate bumps MEGALINTER_VERSION below when a new MegaLinter release is
#      published, and merges it to main.
#   2. That push (or a change to megalinter-custom-flavor.yml) builds the
#      linux/amd64 image and pushes it to ghcr.io as :v<megalinter-version>
#      (no :latest tag is published).
#   3. Renovate then bumps the image tag and digest pinned in action.yml.
#
# Build right after a bump: the upstream builder installs exact Alpine package
# versions (e.g. go), which Alpine deletes at its next update, so an older
# MegaLinter version fails to rebuild until the next MegaLinter release.
#
# The MegaLinter custom flavor image will be available at:
#   - ghcr.io/<owner>/<repo>/megalinter-custom-flavor:<tag>
# =============================================================
name: Build & Push MegaLinter Custom Flavor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/megalinter-custom-flavor-builder.yml
      - megalinter-custom-flavor.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # MegaLinter version the custom flavor is built from.
  # Renovate keeps this in sync with new MegaLinter releases.
  # renovate: datasource=github-releases depName=oxsecurity/megalinter
  MEGALINTER_VERSION: "10.2.0"

jobs:
  build-custom-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MegaLinter Custom Flavor
        uses: oxsecurity/megalinter/flavors/custom-builder@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        with:
          # Renovate strips the "v" from MEGALINTER_VERSION, but builder tags keep it
          megalinter-custom-flavor-builder-tag: v${{ env.MEGALINTER_VERSION }}
          is-latest: "false"
          upload-to-ghcr: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_FLAVOR_BUILD_REPO: ${{ github.repository }}
          CUSTOM_FLAVOR_BUILD_REPO_URL: ${{ github.repositoryUrl }}
          CUSTOM_FLAVOR_BUILD_USER: ${{ github.actor }}
