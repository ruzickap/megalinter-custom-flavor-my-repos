---
# =============================================================
# Build MegaLinter Custom Flavor Workflow
#
# This workflow builds and publishes a custom MegaLinter Docker image
# to GitHub Container Registry (ghcr.io).
#
# Flow (no Personal Access Token required):
#   1. Renovate bumps MEGALINTER_VERSION below (commit type "feat") when a new
#      MegaLinter release is published, and merges it to main.
#   2. release-please opens/updates a release PR for that change.
#   3. Merging the release PR publishes a GitHub Release; release-please.yml
#      then calls this reusable workflow (a release created by GITHUB_TOKEN
#      cannot trigger workflows on its own).
#   4. The image is built from the pinned MegaLinter version for linux/amd64
#      and linux/arm64 and pushed to ghcr.io as :<megalinter-version>
#      (no :latest tag is published).
#
# The MegaLinter custom flavor image will be available at:
#   - ghcr.io/<owner>/<repo>/megalinter-custom-flavor:<tag>
# =============================================================
name: Build & Push MegaLinter Custom Flavor

on:
  # Called by release-please.yml after a release (GITHUB_TOKEN releases cannot
  # trigger workflows), plus manual runs.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # MegaLinter version the custom flavor is built from.
  # Renovate keeps this in sync with new MegaLinter releases.
  # renovate: datasource=github-releases depName=oxsecurity/megalinter
  MEGALINTER_VERSION: "10.1.0"

jobs:
  build-custom-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emulate arm64 for the multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # The builder uses the system daemon (/var/run/docker.sock), whose default
      # image store can't hold multi-platform images
      - name: Enable containerd image store
        run: |
          { sudo cat /etc/docker/daemon.json 2> /dev/null || echo '{}'; } |
            jq '.features."containerd-snapshotter" = true' |
            sudo tee /etc/docker/daemon.json.new > /dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'

      - name: Build MegaLinter Custom Flavor
        uses: oxsecurity/megalinter/flavors/custom-builder@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        with:
          # Renovate strips the "v" from MEGALINTER_VERSION, but builder tags keep it
          megalinter-custom-flavor-builder-tag: v${{ env.MEGALINTER_VERSION }}
          # jscpd and chktex are amd64-only upstream and may fail on arm64
          platform: "linux/amd64,linux/arm64"
          is-latest: "false"
          upload-to-ghcr: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_FLAVOR_BUILD_REPO: ${{ github.repository }}
          CUSTOM_FLAVOR_BUILD_REPO_URL: ${{ github.repositoryUrl }}
          CUSTOM_FLAVOR_BUILD_USER: ${{ github.actor }}
